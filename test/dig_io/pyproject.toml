[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "dig_io"
version = "0.1.0"
description = "DGCL native helpers: contrastive view fns, scaffold splits, PyG-compatible binary shard IO (Rust + PyO3)."
requires-python = ">=3.10,<3.13"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "numpy>=1.23,<2",
]

[tool.maturin]
python-source = "python"
module-name = "dig_io._native"
features = ["pyo3/extension-module"]
